services:
  meilisearch:
    image: getmeili/meilisearch:v1.14
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: masterKey
      SERVER_PORT: "8080"
      SEED_ON_STARTUP: "true"
    depends_on:
      - meilisearch

volumes:
  meili_data:
