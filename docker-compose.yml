services:
  meilisearch:
    image: ghcr.io/brabster/embedded-meilisearch-example/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/brabster/embedded-meilisearch-example/backend:latest
    ports:
      - "8080:8080"
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: masterKey
      SERVER_PORT: "8080"
    depends_on:
      meilisearch:
        condition: service_healthy
