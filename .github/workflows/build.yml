name: Build and Publish

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build and test
        run: make build

      - name: Start Meilisearch
        run: |
          mkdir -p meili_data
          docker run -d --name meilisearch \
            -p 7700:7700 \
            -e MEILI_MASTER_KEY=masterKey \
            -e MEILI_ENV=production \
            -v ${{ github.workspace }}/meili_data:/meili_data \
            getmeili/meilisearch:v1.14

      - name: Seed movies dataset
        env:
          MEILI_HOST: http://localhost:7700
          MEILI_MASTER_KEY: masterKey
        run: sh scripts/seed.sh

      - name: Stop Meilisearch
        run: docker stop meilisearch && docker rm meilisearch

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pre-indexed Meilisearch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: meilisearch/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/meilisearch:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/backend:latest
